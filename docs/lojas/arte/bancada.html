<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- bancada da fila de arte: testa uma imagem num pedaço do jogo, sem o jogo inteiro; no topo, a ficha do item (itens.js). Aberta pelo link que o arte.py imprime
     (?id=…&tipo=tira|borda|moldura|cursor|emblema|carimbo|efeito|textura&cor=hex&img=entrada/ID/pronto-1.png,…) -->
<title>Bancada de arte</title>
<link rel="stylesheet" href="licenca.css">
<style>
:root{color-scheme:dark;--bg:#0F1016;--panel:#161821;--card:#1B1D28;--line:#2A2D3C;--txt:#E6E8F0;--dim:#9197AD;--amb:#E0AF68;--red:#F7768E;--track:#252838;
  --f-ui:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--f-hud:"Chakra Petch",var(--f-ui)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 var(--f-ui)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{margin:0;font:700 16px var(--f-mono)}
header .tipo{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
header button{font:600 13px var(--f-ui);color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
header button[aria-pressed="true"]{background:var(--txt);color:var(--bg)}
header label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim)}
header output{font:600 12px var(--f-mono);color:var(--txt);min-width:3.5em}
main{padding:20px max(16px,env(safe-area-inset-left,0px));display:grid;gap:22px}
h2{margin:0 0 8px;font:600 12px var(--f-mono);color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.linha{display:flex;flex-wrap:wrap;gap:22px;align-items:center}
/* tinta: o branco do desenho pega a cor, o contorno escuro fica (multiplica) e a forma recorta */
.tn{background:var(--u) var(--pos,center)/var(--tam,contain) var(--rep,no-repeat),var(--c);background-blend-mode:multiply;
  -webkit-mask:var(--u) var(--pos,center)/var(--tam,contain) var(--rep,no-repeat);mask:var(--u) var(--pos,center)/var(--tam,contain) var(--rep,no-repeat)}
.pura{background:var(--u) var(--pos,center)/var(--tam,contain) var(--rep,no-repeat)}
.faixa{--rep:repeat-x;--pos:0 center;--tam:auto 100%;width:100%}
.barra{width:min(420px,100%);height:var(--h);background:var(--track);border-radius:99px;overflow:hidden}
.barra > i{display:block;height:100%;width:64%;--rep:repeat-x;--pos:0 center;--tam:auto 100%;animation:vai 2.4s ease-in-out infinite alternate}
@keyframes vai{from{background-position:0 center,0 0;-webkit-mask-position:0 center;mask-position:0 center}to{background-position:-46px center,0 0;-webkit-mask-position:-46px center;mask-position:-46px center}}
.card{background:var(--card);border-radius:4px;padding:16px 18px;color:var(--txt)}
.card small{display:block;color:var(--dim);font-size:12.5px}
.bord{border-style:solid;border-width:var(--bw,var(--esp));border-image:var(--u) var(--fatia) / var(--esp) round;padding:calc(16px + var(--rec,0px)) calc(18px + var(--rec,0px))}
.palco{position:relative;height:min(62vh,520px);background:#000;border-radius:8px;overflow:hidden;cursor:none}
.palco .dica{position:absolute;left:16px;bottom:12px;font:12px var(--f-mono);color:#555}
/* cursor com física (ficha com fisica): a tela é maior, para o fio esticar e o ioiô andar no chão */
.palco.fis{height:min(74vh,640px);user-select:none;-webkit-user-select:none;touch-action:none}
.palco .est{position:absolute;right:16px;top:12px;font:12px var(--f-mono);color:#666;text-align:right}
.dica-fis{margin:0 0 10px;font:12px/1.6 var(--f-mono);color:var(--dim)}  /* fora da tela preta: as bordas e o chão são do cursor */
.prev{display:block}
.cur{position:absolute;left:0;top:0;width:var(--s);height:var(--s);pointer-events:none;transform-origin:0 0;transition:transform .12s}
.cur.pop{transform:scale(.8)}
.box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,86%);display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:default}
.box button{width:26px;height:26px;border-radius:50%;border:2px solid var(--amb);background:none;cursor:pointer;flex:none}
.box.feito button{background:var(--amb)}
.box.feito span{text-decoration:line-through;color:var(--dim)}
.fx{position:absolute;width:140px;height:140px;left:50%;top:50%;margin:-70px 0 0 -70px;pointer-events:none;opacity:0}
.fx.vai{animation:fx 1.1s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes fx{0%{opacity:0;transform:scale(.2) rotate(-12deg)}25%{opacity:1;transform:scale(1.15) rotate(4deg)}45%{transform:scale(1) rotate(0)}100%{opacity:0;transform:translateY(-90px) scale(.9)}}
/* licença de verdade (licenca.css vem do jogo): o emblema entra na caixa branca, o carimbo vai por cima, como tinta */
.lic-w{width:min(520px,100%)} .lic-w .tt-lic{width:100%}
.lic-w .foto{width:58%;aspect-ratio:1;background:url('../../../web/a/killua-3.png') center/cover}
.lic-w .emb > div{width:100%;aspect-ratio:1}
.lic-w .emb.sem{background:none;padding:0;width:70%}  /* o emblema dispensa a caixa branca (a aranha já tem borda clara) */
.lic-w .emb.rei{background:linear-gradient(160deg,#2A2140,#141418);box-shadow:0 0 0 .5cqw #E8C35A}
.lic-w .carimbo{position:absolute;right:4cqw;bottom:4cqw;width:30cqw;aspect-ratio:1;transform:rotate(-10deg);mix-blend-mode:multiply;z-index:2}
/* estojo fatiado em 9 (border-image) por cima da borda que a licença já tem: os cantos encolhem, os lados esticam */
.lic-w .tt-lf{position:relative}
.lic-w .estojo{position:absolute;inset:calc(-1px - var(--fora));border-style:solid;border-width:var(--esp);border-image:var(--u) var(--fatia) / var(--esp) stretch;pointer-events:none;z-index:3}
/* ou a imagem inteira por cima da licença, do tamanho dela (arte feita na proporção da licença, como os SVGs do estojo) */
.lic-w .estojo.inteira{inset:-1px;border:0;border-image:none;background:var(--u) 0 0/100% 100% no-repeat}
.claro{background:#F4F5F9;border-radius:8px;padding:14px}
/* placar do grupo (emblema ao lado do nome, do tamanho da letra), escuro e claro, com o ♠ de texto de hoje para comparar */
.plac{display:grid;gap:2px;width:min(340px,100%);background:#171A23;border-radius:8px;padding:8px;color:#E6E8EE;font-family:var(--f-ui)}
.plac.cl{background:#F4F5F9;color:#1D2030}
.plac .l{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:6px}
.plac .l.eu{background:rgba(224,175,104,.1)}
.plac em{font-style:normal;color:#8A90A2;width:1.1em;font-variant-numeric:tabular-nums}
.plac b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.plac .e{width:1.1em;height:1.1em;flex:none;background:var(--u) center/contain no-repeat}
.plac .e.m{background:currentColor;-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat}  /* ♠ e ♣ na cor do texto */
.plac .t{font-style:normal;color:#E0AF68}
.ficha .fi{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:flex-start}
.ficha .fi-t{flex:1 1 280px;max-width:520px;display:grid;gap:8px}
.ficha .fi-t b{font:700 17px var(--f-ui)}
.ficha .fi-t > span{font:600 12px var(--f-mono);color:var(--dim)}
.ficha p{margin:0}.ficha p i{font-style:normal;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--amb)}
.ficha .aviso{color:var(--dim);font-size:12.5px}
.ficha figure{margin:0;display:grid;gap:6px}.ficha figure img{display:block;max-width:min(380px,100%);border-radius:8px;border:1px solid var(--line)}
.ficha figcaption{font:12px var(--f-mono);color:var(--dim)}
.mold{position:relative;width:min(360px,100%);aspect-ratio:1.6}
.mold .dentro{position:absolute;inset:16%;background:#13213A;border-radius:6px;display:grid;place-items:center;color:#9FB2CF;font:600 12px var(--f-mono)}
.mold .pura{position:absolute;inset:0}
.tex{height:360px;border-radius:8px;display:grid;place-items:center;background:var(--u) 0 0/256px 256px repeat}
@media (prefers-reduced-motion:reduce){.barra > i,.fx.vai{animation:none}.fx.vai{opacity:1}}
</style>
<header>
  <h1 id="nome">—</h1><span class="tipo" id="tipo"></span>
  <span id="vars"></span>
  <label id="ctl-cor" hidden><input type="checkbox" id="usa-cor" checked> com a cor do teste</label>
  <span id="extra"></span>
</header>
<main id="main"></main>
<script src="itens.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const ID = Q.get('id') || '?', TIPO = Q.get('tipo') || 'emblema', IMGS = (Q.get('img') || '').split(',').filter(Boolean);
const COR = Q.get('cor') ? '#' + Q.get('cor') : '';
// item feito em código: a ficha diz qual (fisica:'NOME', em PASTA/NOME.js, pasta = cursores ou a da ficha; o módulo se
// registra em CURSORES.NOME); o desenho é em código, sem imagem. O módulo traz titulo, dica, controles [{k, rot, min, max,
// un, padrao}] e previas(el, cfg), que monta as seções de prévias com as classes desta página (section, h2, .linha,
// .claro); o cursor traz também liga(palco, cfg) → {ajusta, legenda, desliga}, e só com ele a tela preta aparece
let FISICA = '', fis = null, comControles = false;
let atual = 0;
document.getElementById('nome').textContent = ID;
document.getElementById('tipo').textContent = TIPO;
document.title = 'Bancada · ' + ID;
const main = document.getElementById('main');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
// ficha do item (itens.js): de qual item da vitrine é a arte, e como ele é hoje (foto do card, tirada pelo hoje.mjs)
const FICHA = (typeof ITENS !== 'undefined' && ITENS[ID]) || null;
if(FICHA) document.title = 'Bancada · ' + FICHA.nome;
if(FICHA && FICHA.fisica) FISICA = FICHA.fisica;
// a licença hunter como no jogo (mesma marcação da vitrine), com o emblema e o carimbo que se quer testar
const EMBLEMA = '<svg viewBox="0 0 120 70" aria-hidden="true"><path d="M60 10 L84 35 L60 60 L36 35 Z" fill="#C8102E"/><path d="M12 10 L60 60 M60 10 L12 60 M60 10 L108 60 M108 10 L60 60" stroke="#141418" stroke-width="7" fill="none"/><path d="M3 10 H23 M50 10 H70 M97 10 H117 M3 60 H23 M50 60 H70 M97 60 H117" stroke="#141418" stroke-width="3.5"/></svg>';
const licenca = (emb, car, placa = '') => `<div class="lic-w"><div class="tt-lic"><div class="tt-lf"><div class="in">
  <div class="topo"><div class="emb ${placa}">${emb}</div><i class="foto"></i></div>
  <div class="azul"><div class="faixa">TORRE TRICK · T1</div><div class="nomebox"><span>KILLUA</span></div>
  <div class="lls"><span>Nº <b>0012 2026 4817</b></span><span><b>2º</b> NO GERAL</span><span>SEQ. <b>14</b></span></div></div></div>${car}</div></div></div>`;
function ficha(){
  if(!FICHA) return '';
  const f = FICHA, v = f.vit;
  const foto = v ? `<figure><img src="${encodeURI('hoje/' + v.arq + '-' + v.id + '.png')}" alt="card de ${esc(f.nome)} na vitrine" onerror="this.closest('figure').remove()"><figcaption>o card na vitrine ${v.arq === 'masadora' ? 'da Masadora' : 'da Associação'}, como é hoje</figcaption></figure>` : '';
  return `<section class="ficha"><h2>de qual item é esta arte</h2><div class="fi"><div class="fi-t"><b>${esc(f.nome)}</b><span>${esc(f.loja)} · ${esc(f.onde)}</span>
    <p><i>Como é hoje</i><br>${esc(f.hoje)}</p><p><i>A arte nova</i><br>${esc(f.arte)}</p>
    <p class="aviso">O que a fila gera é só o desenho das variações. O resto da página (licença, tamanhos, card do Killua, barras…) é pedaço de teste para julgar o desenho em uso; nada disso vai para o jogo.</p></div>${foto}</div></section>`;
}
const url = () => `url('${encodeURI(IMGS[atual])}')`;
const usaCor = () => COR && document.getElementById('usa-cor').checked;
const pinta = (cor) => usaCor() || cor ? `class="tn" style="--u:${url()};--c:${cor || COR}` : `class="pura" style="--u:${url()}`;
if(COR) document.getElementById('ctl-cor').hidden = false;
document.getElementById('usa-cor').onchange = () => desenha();

// variações: 1, 2, 3…
const vars = document.getElementById('vars');
IMGS.forEach((_, i) => { const b = document.createElement('button'); b.textContent = 'variação ' + (i + 1); b.setAttribute('aria-pressed', String(i === 0));
  b.onclick = () => { atual = i; vars.querySelectorAll('button').forEach((x, j) => x.setAttribute('aria-pressed', String(j === i))); desenha(); }; vars.append(b); });

// controles que só a borda e o cursor usam
const st = {esp: 16, fatia: 12, s: 40, rec: 0, por: false};
function controle(k, rot, min, max, un, muda = desenha){
  const l = document.createElement('label'); l.innerHTML = `${rot} <input type="range" id="c-${k}" min="${min}" max="${max}" value="${st[k]}"> <output>${st[k]}${un}</output>`;
  l.querySelector('input').oninput = e => { st[k] = +e.target.value; l.querySelector('output').textContent = st[k] + un; muda(); };
  document.getElementById('extra').append(l);
}
if(TIPO === 'borda'){
  controle('esp', 'espessura', 4, 28, 'px'); controle('fatia', 'fatia', 4, 40, '%'); controle('rec', 'campo recuado', 0, 24, 'px');
  const l = document.createElement('label'); l.innerHTML = '<input type="checkbox" id="por-cima"> corrente sobre o campo';
  l.querySelector('input').onchange = e => { st.por = e.target.checked; desenha(); }; document.getElementById('extra').append(l);
}
if(TIPO === 'cursor' && !FISICA) controle('s', 'tamanho', 20, 72, 'px');
if(TIPO === 'moldura'){
  Object.assign(st, {esp: 11, fatia: 20, fora: 0, inteira: Q.get('inteira') === '1'});
  const l = document.createElement('label'); l.innerHTML = `<input type="checkbox" ${st.inteira ? 'checked' : ''}> camada inteira (sem fatiar)`;
  l.querySelector('input').onchange = e => { st.inteira = e.target.checked; desenha(); }; document.getElementById('extra').append(l);
  controle('esp', 'espessura', 4, 40, 'px'); controle('fatia', 'fatia', 4, 45, '%'); controle('fora', 'cantos para fora', 0, 16, 'px');
}

function desenha(){
  if(FISICA){ desenhaFisica(); return; }
  if(!IMGS.length){ main.innerHTML = '<p>Sem imagem: rode o arte.py prepara.</p>'; return; }
  const u = url(), h = [];
  if(TIPO === 'tira'){
    h.push(`<section><h2>repetida · 48 · 24 · 14 px</h2><div style="display:grid;gap:14px">${[48,24,14].map(x => `<div class="faixa pura" style="--u:${u};height:${x}px"></div>`).join('')}</div></section>`);
    h.push(`<section><h2>barra de XP e vida do chefão (indo e voltando)</h2><div style="display:grid;gap:14px">
      <div class="barra" style="--h:12px"><i class="tn" style="--u:${u};--c:var(--amb)"></i></div>
      <div class="barra" style="--h:16px"><i class="tn" style="--u:${u};--c:var(--red)"></i></div>
      <div class="barra" style="--h:12px"><i class="pura" style="--u:${u}"></i></div></div></section>`);
  } else if(TIPO === 'borda'){
    const b = `--u:${u};--esp:${st.esp}px;--fatia:${st.fatia}%;--rec:${st.rec}px;--bw:${st.por ? Math.round(st.esp * .35) : st.esp}px`;
    h.push(`<section><h2>cards de tamanhos diferentes (espessura e fatia até os cantos encaixarem; "campo recuado" afasta o conteúdo da corrente; "corrente sobre o campo" deixa a corrente invadir o campo em vez de ser cortada por ele)</h2><div class="linha" style="align-items:flex-start">
      <div class="card bord" style="${b};width:min(420px,100%)"><b>Perfil</b><small>Andar 199 · 2.378 XP na temporada</small><small>faltam 14 XP para o 200</small></div>
      <div class="card bord" style="${b};width:260px"><b>Quanto vale</b><small>até +23 XP</small></div>
      <div class="card bord" style="${b};width:200px;height:220px"><b>Chefões</b><small>ARQ1 · 86%</small><small>BD · 87%</small></div></div></section>`);
  } else if(TIPO === 'cursor'){
    h.push(`<section><h2>mexa o mouse na tela preta · clique</h2><div class="palco" id="palco"><div class="cur" id="cur" style="--s:${st.s}px"><div ${pinta()};width:100%;height:100%"></div></div><span class="dica">a ponta do cursor é o canto de cima à esquerda da imagem</span></div></section>`);
    h.push(`<section><h2>48 · 32 · 24 px</h2><div class="linha">${[48,32,24].map(x => `<div ${pinta()};width:${x}px;height:${x}px"></div>`).join('')}</div></section>`);
  } else if(TIPO === 'efeito'){
    h.push(`<section><h2>conclua a tarefa (clique no círculo; de novo para repetir)</h2><div class="palco" style="cursor:default"><div class="box" id="box"><button type="button" aria-label="concluir"></button><span>Ler o que são X.25, Frame Relay e ATM</span></div><div class="fx" id="fx"><div ${pinta()};width:100%;height:100%"></div></div></div></section>`);
    h.push(`<section><h2>128 · 64 · 32 px</h2><div class="linha">${[128,64,32].map(x => `<div ${pinta()};width:${x}px;height:${x}px"></div>`).join('')}</div></section>`);
  } else if(TIPO === 'moldura'){
    if(/^(lic|lg)-/.test(ID)) h.push(`<section><h2>na licença do jogo (520 px): o desenho é fatiado em 9, os cantos encolhem e os lados esticam. Com 11 px o estojo ocupa só a borda que a licença já tem; mais grosso que isso começa a tampar o conteúdo; "cantos para fora" deixa o estojo crescer para fora da licença em vez de para dentro. Com "camada inteira", a imagem entra do tamanho da licença, sem fatiar</h2>${licenca(EMBLEMA, `<i class="estojo${st.inteira ? ' inteira' : ''}" style="--u:${u};--esp:${st.esp}px;--fatia:${st.fatia}%;--fora:${st.fora}px"></i>`).replace('class="tt-lic"', ID === 'lic-ouro' ? 'class="tt-lic tl-est-ouro"' : 'class="tt-lic"')}</section>`);
    h.push(`<section><h2>a imagem inteira, esticada em volta de um retângulo</h2><div class="mold"><div class="dentro">LICENÇA HUNTER</div><div class="pura" style="--u:${u};--tam:100% 100%"></div></div></section>`);
  } else if(TIPO === 'textura'){
    h.push(`<section><h2>fundo repetido, com um card por cima</h2><div class="tex" style="--u:${u}"><div class="card" style="width:min(320px,90%)"><b>Lista</b><small>Ler o que são X.25, Frame Relay e ATM</small></div></div></section>`);
  } else {
    if(TIPO === 'carimbo') h.push(`<section><h2>na licença (girado, como tinta)</h2>${licenca(EMBLEMA, `<div class="carimbo"><div ${pinta()};width:100%;height:100%"></div></div>`)}</section>`);
    if(TIPO === 'emblema' && /^(lic|lg)-/.test(ID)){ const pl = (FICHA && FICHA.placa) || ''; h.push(`<section><h2>na licença, no lugar do emblema hunter${pl === 'sem' ? ' (sem a caixa branca)' : pl === 'rei' ? ' (na placa escura do Rei, como no jogo)' : ''}</h2>${licenca(`<div ${pinta()}"></div>`, '', pl)}</section>`); }
    if(TIPO === 'emblema' && /^naipe-/.test(ID)){
      // o conjunto da mesma versão (clássico ou afiado) com o coringa, como fica nos placares
      const base = IMGS[atual], pasta = base.slice(0, base.lastIndexOf('/') + 1), estilo = (base.match(/(classico|afiado)-/) || [, 'classico'])[1];
      const conj = [...['espadas', 'copas', 'ouros', 'paus'].map(s => `${pasta}${estilo}-${s}.svg`), `${pasta}coringa.svg`];
      const nomes = ['Killua', 'Gon', 'Kurapika', 'Leorio', 'Hisoka'], pts = ['1.920', '1.840', '1.611', '1.402', '0'];
      const placar = (px, cl) => `<div class="plac ${cl ? 'cl' : ''}" style="font-size:${px}px">` + conj.map((u, i) =>
        `<div class="l ${u === base ? 'eu' : ''}"><em>${i + 1}</em><i class="e ${/(espadas|paus)\.svg$/.test(u) ? 'm' : ''}" style="--u:url('${encodeURI(u)}')"></i><span>${nomes[i]}${i === 4 ? ' (descanso)' : ''}</span><b>${pts[i]}</b></div>`).join('')
        + `<div class="l"><em>·</em><i class="t">♠</i><span>hoje (texto)</span><b></b></div></div>`;
      h.push(`<section><h2>nos placares, do tamanho da letra (14 e 16 px), no escuro e no claro · conjunto ${estilo}</h2><div class="linha" style="align-items:flex-start">${placar(14)}${placar(16)}${placar(14, 1)}${placar(16, 1)}</div></section>`);
    }
    const tam = [128,64,48,32].map(x => `<div ${pinta()};width:${x}px;height:${x}px"></div>`).join('');
    h.push(`<section><h2>128 · 64 · 48 · 32 px, no escuro e no claro</h2><div class="linha">${tam}</div><div class="linha claro" style="margin-top:12px">${tam}</div></section>`);
    h.push(`<section><h2>no card</h2><div class="card" style="display:flex;gap:14px;align-items:center;width:min(360px,100%)"><div ${pinta()};width:44px;height:44px;flex:none"></div><div><b>Killua</b><small>2º da semana · 1.840</small></div></div></section>`);
  }
  main.innerHTML = ficha() + h.join('');
  liga();
}

// cursor com física: a tela preta com o cursor de verdade, e as prévias paradas que o módulo monta
function desenhaFisica(){
  if(fis){ fis.desliga(); fis = null; }
  const M = (window.CURSORES && CURSORES[FISICA]) || (window.TRANSICOES && TRANSICOES[FISICA]);
  if(!M){
    // a ficha pode pedir scripts de apoio antes (antes:['transicoes/base.js']), carregados na ordem
    const carrega = src => new Promise(ok => { const s = document.createElement('script'); s.src = src; s.onload = ok; document.head.append(s); });
    (async () => { for(const a of FICHA.antes || []) await carrega(a); await carrega(`${FICHA.pasta || 'cursores'}/${FISICA}.js`); desenhaFisica(); })();
    return;
  }
  if(!comControles){
    // mexem no cursor ao vivo, sem refazer a página (o que está na tela continua onde está)
    comControles = true;
    (M.controles || []).forEach(c => { st[c.k] = c.padrao; controle(c.k, c.rot, c.min, c.max, c.un, () => { fis && fis.ajusta(st); M.previas && M.previas(document.getElementById('prev'), st); }); });
  }
  if(!M.liga){
    main.innerHTML = ficha() + `<p class="dica-fis">${M.dica || ''}</p><div id="prev" style="display:grid;gap:22px"></div>`;
    M.previas(document.getElementById('prev'), st); return;
  }
  main.innerHTML = ficha() + `<section><h2>${M.titulo}</h2><p class="dica-fis">${M.dica}</p><div class="palco fis" id="palco"><span class="est" id="est"></span></div></section><div id="prev" style="display:grid;gap:22px"></div>`;
  fis = M.liga(document.getElementById('palco'), st);
  if(M.previas) M.previas(document.getElementById('prev'), st);
  const est = document.getElementById('est');
  const mostra = () => { if(!document.body.contains(est)) return; est.textContent = fis.legenda(); setTimeout(mostra, 120); };
  mostra();
}

function liga(){
  const palco = document.getElementById('palco'), cur = document.getElementById('cur');
  if(palco && cur){
    let x = 60, y = 60, tx = 60, ty = 60;
    palco.onmousemove = e => { const r = palco.getBoundingClientRect(); tx = e.clientX - r.left; ty = e.clientY - r.top; };
    palco.onmousedown = () => cur.classList.add('pop'); palco.onmouseup = () => cur.classList.remove('pop');
    const passo = t => { if(!document.body.contains(cur)) return; x += (tx - x) * .5; y += (ty - y) * .5;
      cur.style.translate = `${x}px ${y}px`; cur.style.rotate = `${Math.sin(t / 500) * 4}deg`; requestAnimationFrame(passo); };
    requestAnimationFrame(passo);
  }
  const box = document.getElementById('box'), fx = document.getElementById('fx');
  if(box && fx) box.querySelector('button').onclick = () => { box.classList.toggle('feito'); fx.classList.remove('vai'); void fx.offsetWidth; if(box.classList.contains('feito')) fx.classList.add('vai'); };
}
desenha();
</script>
